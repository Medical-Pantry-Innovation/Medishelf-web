<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440" role="img" aria-label="Sample medical device carton label">
  <defs>
    <pattern id="bars" width="13" height="1" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="1" fill="#101828"/>
      <rect x="3" y="0" width="1" height="1" fill="#101828"/>
      <rect x="5" y="0" width="3" height="1" fill="#101828"/>
      <rect x="9" y="0" width="1" height="1" fill="#101828"/>
      <rect x="11" y="0" width="2" height="1" fill="#101828"/>
    </pattern>
  </defs>

  <rect width="620" height="440" fill="#eceae4"/>
  <rect x="18" y="18" width="584" height="404" fill="#fdfdfb" stroke="#c9c6bd" stroke-width="1.5"/>

  <!-- product identity -->
  <text x="42" y="74" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#101828">Hypodermic Needle</text>
  <text x="42" y="104" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#101828">21G &#215; 38 mm</text>
  <text x="42" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5a6672">Vantyn Medical Pty Ltd</text>

  <line x1="42" y1="148" x2="578" y2="148" stroke="#d8d5cc" stroke-width="1"/>

  <!-- coded fields, drawn the way a carton prints them -->
  <g font-family="Courier New, monospace" font-size="14" fill="#101828">
    <rect x="42" y="164" width="40" height="19" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="48" y="178" font-size="12" font-weight="700">REF</text>
    <text x="94" y="178">VN-2138</text>

    <rect x="232" y="164" width="40" height="19" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="238" y="178" font-size="12" font-weight="700">LOT</text>
    <text x="284" y="178">215476KS</text>

    <rect x="42" y="198" width="40" height="19" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="48" y="212" font-size="12" font-weight="700">EXP</text>
    <text x="94" y="212">2028-10-31</text>

    <rect x="232" y="198" width="40" height="19" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="238" y="212" font-size="12" font-weight="700">QTY</text>
    <text x="284" y="212">Box of 100</text>
  </g>

  <!-- handling marks -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#101828">
    <rect x="42" y="236" width="96" height="21" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="52" y="251">STERILE EO</text>
    <rect x="150" y="236" width="104" height="21" fill="none" stroke="#101828" stroke-width="1.5"/>
    <text x="160" y="251">SINGLE USE</text>
  </g>

  <!-- barcode -->
  <rect x="42" y="282" width="330" height="60" fill="url(#bars)"/>
  <text x="42" y="362" font-family="Courier New, monospace" font-size="13" fill="#3d4954">(01)09327911001522(10)215476KS(17)281031</text>

  <!-- address block -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5a6672">
    <text x="42" y="396">14 Kerrin Way, Dandenong South VIC 3175, Australia</text>
    <text x="42" y="412">Made in Australia</text>
  </g>

  <!-- sample watermark, so this is never mistaken for a real product label -->
  <text x="578" y="412" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#b0ada3">SAMPLE</text>
</svg>
